{% load render_vite_bundle %}
<!DOCTYPE html>
<html lang="en">

<!--
  For this base.html to work in dev and in production,
  you'll need to set a couple of keys inside your settings.default.py.
  Another file in this gist shows which ones you'll really need.
-->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="origin" />
<title class="notranslate" translate="no">miniSASS</title>

  <!-- Declared explicitly so browsers use these rather than falling back to a
       bare request for /favicon.ico at the site root, which Django does not
       route. The files are collected to STATIC_ROOT by collectstatic. -->
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/site.webmanifest">

  {% if dev_mode %}
  <script type="module" src="http://localhost:5173/@vite/client"></script>

  <!-- If you're using vite with React, this next script will be needed for HMR -->
  <script type="module">
    import RefreshRuntime from 'http://localhost:5173/@react-refresh'
    if (RefreshRuntime) {
      RefreshRuntime.injectIntoGlobalHook(window)
      window.$RefreshReg$ = () => { }
      window.$RefreshSig$ = () => (type) => type
      window.__vite_plugin_react_preamble_installed__ = true
    }
  </script>
  {% endif %}
  <script type="application/javascript">
    const GOOGLE_ANALYTICS_TRACKING_CODE = "{{ GOOGLE_ANALYTICS_TRACKING_CODE }}";
    const PRIVACY_POLICY_VERSION = "{{ PRIVACY_POLICY_VERSION }}";
    const COUNTRIES_DICT = {{ COUNTRIES_DICT|safe }};
    const YOMA_AUTH_URL = "{{ YOMA_AUTH_URL|safe }}";
  </script>
</head>

<body>

  <div id="root"></div>

  {% if dev_mode %}
  <!-- This url will be different for each type of app. Point it to your main js file. -->
  <script type="module" src="http://localhost:5173/index.tsx"></script>
  {% else %}
  {% render_vite_bundle %}
  {% endif %}
</body>

</html>
