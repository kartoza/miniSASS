
# Configuration
theme:
  name: material
  logo: img/img_minisasslogo1.png
  language: en
  direction: ltr
  include_search_page: false
  search_index_only: true
  features:
    - content.code.annotate
    - content.tabs.link
    - header.autohide
#    - navigation.expand # stop auto-expanding menus
    - navigation.indexes
    - navigation.instant
#    - navigation.sections # This removes the ability to shrink sections on the nav menu but gives the bold headings
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-6
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/logo.png
  icon:
    logo: material/book

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/iwmihq
    - icon: fontawesome/solid/earth-africa
      link: https://minisass.org
    - icon: fontawesome/solid/water
      link: https://www.iwmi.org

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - js/tablesort.js

plugins:
  - search
  # mkdocstrings was configured here but no page uses its "::: module" syntax, and
  # its "import:" option was renamed to "inventories:" in current releases, so the
  # build aborted with:
  #   TypeError: PythonConfig.__init__() got an unexpected keyword argument 'import'
  # Removed rather than pinned, since nothing depends on it. Re-add it (with
  # "inventories:") if Python API pages are ever generated from docstrings.

