##############################################################################
# LOCAL DEVELOPMENT nginx config (docker compose)
#
# Why this file exists separately from ../sites-enabled/default.conf:
#   The sibling config is shaped for ECS "awsvpc" networking, where every
#   container in the task shares one network namespace. It therefore listens on
#   8090 and points its upstreams at 127.0.0.1:8080 / 127.0.0.1:7800.
#   Under docker compose each service is its own host, so 127.0.0.1 resolves to
#   nginx itself and the site never loads. This config uses the compose service
#   names (django, tiles) and listens on 80.
#
# Differences from production, all deliberate:
#   /static/       served from the local static-data volume rather than proxied
#                  to S3, so collectstatic + frontend rebuilds show up at once.
#   /minio-media/  proxied UNSIGNED to the real production bucket
#                  s3://minisass (public via the PublicReadMedia bucket policy).
##############################################################################

upstream django {
    server django:8080;
}

upstream tiles {
    server tiles:7800;
}

server {
    listen      80;
    server_name _;
    charset     utf-8;

    # OTF gzip compression
    gzip on;
    gzip_min_length 860;
    gzip_comp_level 5;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain application/xml application/x-javascript text/xml text/css application/json application/octet-stream;
    client_max_body_size 512M;

    add_header Referrer-Policy "origin" always;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Drop any non django related requests
    location ~ (\.php|.aspx|.asp|myadmin) {
        return 404;
    }

    # Django media (local volume)
    location /media {
        add_header 'Access-Control-Allow-Origin' '*' always;
        alias /home/web/media;
        expires 21d;
    }

    # Static files from the local static-data volume, written by collectstatic.
    location /static/ {
        alias /home/web/static/;
        expires 1h;
    }

    # Observation / site / certificate images.
    #
    # settings.MinisassS3Storage.url() renders file fields as /minio-media/<key>,
    # where <key> already carries the "minisass/" prefix, e.g.
    #   /minio-media/minisass/observations/foo.jpg
    #     -> https://minisass.s3.af-south-1.amazonaws.com/minisass/observations/foo.jpg
    #
    # Reads are unsigned and rely on the bucket's PublicReadMedia policy, so no
    # AWS credentials are needed on this path. Uploads go through boto3 in
    # Django and DO use the credentials in .env.
    location /minio-media/ {
        add_header 'Access-Control-Allow-Origin' '*' always;

        proxy_pass https://minisass.s3.af-south-1.amazonaws.com/;
        proxy_set_header Host minisass.s3.af-south-1.amazonaws.com;
        proxy_ssl_server_name on;

        # Do not forward local cookies/auth to S3.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";

        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-meta-server-side-encryption;
        proxy_hide_header x-amz-server-side-encryption;

        expires 21d;
    }

    location /tiles {
        proxy_pass http://tiles;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        port_in_redirect off;
        proxy_connect_timeout 600;
        proxy_set_header X-Script-Name /tiles;
    }

    # Everything else to Django over the uwsgi protocol.
    location / {
        uwsgi_pass django;

        uwsgi_param  QUERY_STRING       $query_string;
        uwsgi_param  REQUEST_METHOD     $request_method;
        uwsgi_param  CONTENT_TYPE       $content_type;
        uwsgi_param  CONTENT_LENGTH     $content_length;

        uwsgi_param  REQUEST_URI        $request_uri;
        uwsgi_param  PATH_INFO          $document_uri;
        uwsgi_param  DOCUMENT_ROOT      $document_root;
        uwsgi_param  SERVER_PROTOCOL    $server_protocol;
        uwsgi_param  HTTPS              $https if_not_empty;

        uwsgi_param  REMOTE_ADDR        $remote_addr;
        uwsgi_param  REMOTE_PORT        $remote_port;
        uwsgi_param  SERVER_PORT        $server_port;
        uwsgi_param  SERVER_NAME        $server_name;

        uwsgi_read_timeout 300;
        uwsgi_send_timeout 300;
    }
}
